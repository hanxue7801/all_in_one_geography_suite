<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学地理与天体物理互动教学课件矩阵 · 正版商业授权</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-3xl w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block p-3 rounded-2xl bg-amber-500/20 text-amber-400 text-3xl mb-2">🔭 🌍</div>
      <h1 class="text-2xl md:text-3xl font-black text-white">中学地理 3D 虚拟互动教学系统</h1>
      <p class="text-slate-400 text-sm">正版商业授课版 · 点击下方卡片进入对应 3D 引擎</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
      <!-- Card 1 -->
      <a href="solar_trajectory/index.html" class="group block p-5 rounded-2xl bg-slate-950/80 border border-slate-800 hover:border-amber-500/80 transition-all hover:scale-[1.02] shadow-lg">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl p-2 rounded-xl bg-amber-500/10 text-amber-400">🏛️</span>
          <div>
            <h2 class="text-base font-bold text-white group-hover:text-amber-400 transition">太阳视运动大屏观测台</h2>
            <span class="text-xs text-amber-300/80 font-mono">地平天穹 · 日晷测影 · 纬度联动</span>
          </div>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          地平面天球视界、1m标杆实时投影计算、夏至/二分/冬至三维日轨高显、中国六大典型纬度带与平铺世界地图实时联动。
        </p>
        <div class="mt-4 flex items-center text-xs font-bold text-amber-400 gap-1">
          <span>进入观测台</span>
          <span>→</span>
        </div>
      </a>

      <!-- Card 2 -->
      <a href="earth_revolution/index.html" class="group block p-5 rounded-2xl bg-slate-950/80 border border-slate-800 hover:border-cyan-500/80 transition-all hover:scale-[1.02] shadow-lg">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl p-2 rounded-xl bg-cyan-500/10 text-cyan-400">🪐</span>
          <div>
            <h2 class="text-base font-bold text-white group-hover:text-cyan-400 transition">地球运动 3D 物理引擎</h2>
            <span class="text-xs text-cyan-300/80 font-mono">公转引擎 · 自转引擎 · 二分二至</span>
          </div>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          3D立体加厚鲜红赤道圈、二分二至地轴空间平行永指北极星演示、太阳直射点动态轨迹、北逆南顺极点俯视视角。
        </p>
        <div class="mt-4 flex items-center text-xs font-bold text-cyan-400 gap-1">
          <span>进入物理引擎</span>
          <span>→</span>
        </div>
      </a>
    </div>

    <!-- 授权状态状态栏 -->
    <div id="auth-status-bar" class="p-4 rounded-2xl bg-slate-950/60 border border-slate-800 flex items-center justify-between text-xs text-slate-400">
      <div class="flex items-center gap-2">
        <span id="auth-icon">🔒</span>
        <span id="auth-text">当前设备授权状态：正在检测...</span>
      </div>
      <button id="auth-action-btn" class="px-3 py-1.5 rounded-xl bg-amber-500/20 text-amber-400 hover:bg-amber-500/30 font-bold transition">
        输入激活码
      </button>
    </div>

    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-800 flex items-center justify-center gap-2">
      <span>🛡️ 已启用双核知识产权防篡改与离线激活码授权体系</span>
    </div>
  </div>

  <script>
  (function() {
    const STORAGE_KEY = 'GEO_SUITE_LICENSED_AUTH';
    const SALT = 'GEO_PRO_2026_AUTHORIZE_SECRET';
    const MASTER_PINS = ['GEO888', 'TEACH2026', '668899'];

    async function sha256(str) {
      const buf = new TextEncoder().encode(str);
      const hBuf = await crypto.subtle.digest('SHA-256', buf);
      return Array.from(new Uint8Array(hBuf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function verifyKey(key) {
      if (!key) return false;
      const k = key.trim().toUpperCase();
      if (MASTER_PINS.includes(k)) return true;
      const parts = k.split('-');
      if (parts.length !== 3 || parts[0] !== 'GEO') return false;
      const hash = await sha256(parts[1] + '-' + SALT);
      return parts[2] === hash.substring(0, 4).toUpperCase();
    }

    const authText = document.getElementById('auth-text');
    const authIcon = document.getElementById('auth-icon');
    const authBtn = document.getElementById('auth-action-btn');

    async function checkState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved && await verifyKey(saved)) {
        authIcon.innerText = '✅';
        authText.innerHTML = '<span class="text-emerald-400 font-bold">正版授权已激活</span> · 凭证：<span class="font-mono text-amber-400 font-bold">' + saved + '</span>';
        authBtn.innerText = '更换激活码';
        authBtn.className = 'px-3 py-1.5 rounded-xl bg-slate-800 text-slate-300 hover:bg-slate-700 font-medium transition';
      } else {
        authIcon.innerText = '🔒';
        authText.innerHTML = '<span class="text-amber-400 font-bold">尚未激活</span> · 请输入正版卡密解锁课件';
        authBtn.innerText = '立即激活';
        authBtn.className = 'px-3 py-1.5 rounded-xl bg-amber-500 text-slate-950 hover:bg-amber-400 font-bold transition shadow-lg shadow-amber-500/20';
      }
    }

    authBtn.addEventListener('click', async () => {
      const code = prompt('请输入正版激活码或卡密 (如 GEO-XXXXXX-XXXX)：');
      if (code) {
        if (await verifyKey(code)) {
          localStorage.setItem(STORAGE_KEY, code.trim().toUpperCase());
          alert('🎉 激活成功！全部 3D 课件已解锁，欢迎使用！');
          checkState();
        } else {
          alert('❌ 激活码无效，请检查是否输入有误或联系客服获取。');
        }
      }
    });

    checkState();
  })();
  </script>
</body>
</html>
