<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>中学地理与天体物理互动教学课件矩阵</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
  <div class="max-w-3xl w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-6 md:p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block p-3 rounded-2xl bg-amber-500/20 text-amber-400 text-3xl mb-2">🔭 🌍</div>
      <h1 class="text-2xl md:text-3xl font-black text-white">中学地理 3D 虚拟互动教学系统</h1>
      <p class="text-slate-400 text-sm">点击下方任意卡片，即刻进入对应的 3D 交互引擎（全屏授课优化）</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
      <!-- Card 1 -->
      <a href="solar_trajectory/index.html" class="group block p-5 rounded-2xl bg-slate-950/80 border border-slate-800 hover:border-amber-500/80 transition-all hover:scale-[1.02] shadow-lg">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl p-2 rounded-xl bg-amber-500/10 text-amber-400">🏛️</span>
          <div>
            <h2 class="text-base font-bold text-white group-hover:text-amber-400 transition">太阳视运动大屏观测台</h2>
            <span class="text-xs text-amber-300/80 font-mono">地平天穹 · 日晷测影 · 纬度联动</span>
          </div>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          地平面天球视界、1m标杆实时投影计算、夏至/二分/冬至三维日轨高显、中国六大典型纬度带与平铺世界地图实时联动。
        </p>
        <div class="mt-4 flex items-center text-xs font-bold text-amber-400 gap-1">
          <span>进入观测台</span>
          <span>→</span>
        </div>
      </a>

      <!-- Card 2 -->
      <a href="earth_revolution/index.html" class="group block p-5 rounded-2xl bg-slate-950/80 border border-slate-800 hover:border-cyan-500/80 transition-all hover:scale-[1.02] shadow-lg">
        <div class="flex items-center gap-3 mb-3">
          <span class="text-2xl p-2 rounded-xl bg-cyan-500/10 text-cyan-400">🪐</span>
          <div>
            <h2 class="text-base font-bold text-white group-hover:text-cyan-400 transition">地球运动 3D 物理引擎</h2>
            <span class="text-xs text-cyan-300/80 font-mono">公转引擎 · 自转引擎 · 二分二至</span>
          </div>
        </div>
        <p class="text-xs text-slate-400 leading-relaxed">
          3D立体加厚鲜红赤道圈、二分二至地轴空间平行永指北极星演示、太阳直射点动态轨迹、北逆南顺极点俯视视角。
        </p>
        <div class="mt-4 flex items-center text-xs font-bold text-cyan-400 gap-1">
          <span>进入物理引擎</span>
          <span>→</span>
        </div>
      </a>
    </div>

    <div class="text-center text-xs text-slate-500 pt-2 border-t border-slate-800">
      🔒 本套课件已集成全逻辑字节码加密与反调试防护 · 仅供大屏教学展示
    </div>
  </div>

</html>
